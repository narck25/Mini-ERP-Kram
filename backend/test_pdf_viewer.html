<!DOCTYPE html>
<html>
<head>
    <title>Test PDF Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-container { margin: 20px 0; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; }
        button { margin: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Test PDF Viewer</h1>
    
    <div class="test-container">
        <h2>Test 1: CV PDF</h2>
        <button onclick="loadCV()">Load CV PDF</button>
        <iframe id="pdfViewer" src=""></iframe>
    </div>

    <div class="test-container">
        <h2>Test 2: Psych Test PDF</h2>
        <button onclick="loadPsychTest()">Load Psych Test PDF</button>
        <iframe id="pdfViewer2" src=""></iframe>
    </div>

    <div class="test-container">
        <h2>Test 3: URL Encoding Test</h2>
        <p>Original URL: http://localhost:3001/uploads/cvs/1772552220234_CV_COMERCIALIZADORA_KRAM_TELCO_NUEVO_DEDICADO_V1.2_(2).pdf</p>
        <p>Encoded URL: <span id="encodedUrl"></span></p>
        <button onclick="testEncodedUrl()">Test Encoded URL</button>
        <iframe id="pdfViewer3" src=""></iframe>
    </div>

    <script>
        function loadCV() {
            const url = 'http://localhost:3001/uploads/cvs/1772552220234_CV_COMERCIALIZADORA_KRAM_TELCO_NUEVO_DEDICADO_V1.2_(2).pdf';
            document.getElementById('pdfViewer').src = url;
            console.log('Loading CV:', url);
        }

        function loadPsychTest() {
            const url = 'http://localhost:3001/uploads/psych-tests/1772552220234_PSYCH_COMERCIALIZADORA_KRAM_TELCO_NUEVO_DEDICADO_V2_(3).pdf';
            document.getElementById('pdfViewer2').src = url;
            console.log('Loading Psych Test:', url);
        }

        function testEncodedUrl() {
            const baseUrl = 'http://localhost:3001';
            const path = '/uploads/cvs/1772552220234_CV_COMERCIALIZADORA_KRAM_TELCO_NUEVO_DEDICADO_V1.2_(2).pdf';
            const encodedUrl = encodeURI(`${baseUrl}${path}`);
            
            document.getElementById('encodedUrl').textContent = encodedUrl;
            document.getElementById('pdfViewer3').src = encodedUrl;
            console.log('Encoded URL:', encodedUrl);
        }

        // Test the encoded URL on load
        window.onload = function() {
            testEncodedUrl();
        };
    </script>
</body>
</html>
