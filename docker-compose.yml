version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kramadmin
      POSTGRES_PASSWORD: krampassword123
      POSTGRES_DB: kram_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kramadmin -d kram_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kram-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kram-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kram.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - kram-network

volumes:
  postgres_data:

networks:
  kram-network:
    driver: bridge