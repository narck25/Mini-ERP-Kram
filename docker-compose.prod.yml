version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kramadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-krampassword123}
      POSTGRES_DB: ${DB_NAME:-kram_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kram-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kramadmin} -d ${DB_NAME:-kram_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kram-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kramadmin}:${DB_PASSWORD:-krampassword123}@postgres:5432/${DB_NAME:-kram_erp}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "7d"
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-https://erp.kramhub.site}
      TRUST_PROXY: "1"
      BASE_URL: ${BASE_URL:-https://apierp.kramhub.site}
      SERVICE_FQDN_FRONTEND: ${SERVICE_FQDN_FRONTEND:-erp.kramhub.site}
      SERVICE_FQDN_BACKEND: ${SERVICE_FQDN_BACKEND:-apierp.kramhub.site}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - kram-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001}
    container_name: kram-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001}
      NEXT_PUBLIC_ALLOWED_ORIGIN: ${SERVICE_FQDN_FRONTEND:-erp.kramhub.site}
      # Deshabilitar telemetría de Next.js
      NEXT_TELEMETRY_DISABLED: 1
      # Configuración de memoria para Node.js (previene memory leaks)
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "3002:3000"
    networks:
      - kram-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M

volumes:
  postgres_data:
  backend_uploads:

networks:
  kram-network:
    driver: bridge
